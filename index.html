    <body class="min-h-screen bg-cover bg-center bg-fixed" style="background-image: url('./image/4.jpg');">

        <nav class="flex items-center justify-between px-8 py-5">

            <div class="text-4xl font-bold text-orange-600">

            <div class="flex-1 flex gap-8 justify-center">
                <a href="###" class="text-1xl font-bold text-gray-300 hover:text-orange-400">

                <a href="###" class="text-1xl font-bold text-gray-300 hover:text-orange-400">

                </a>
                <a href="###" class="text-1xl font-bold text-gray-300 hover:text-orange-400">

                </a>
                <a href="###" class="text-1xl font-bold text-gray-300 hover:text-orange-400">

                </a>
                <a href="###" class="text-1xl font-bold text-gray-300 hover:text-orange-400">
                    CONTACT
                </a>
            </div>

            <div class="flex h-[45px] w-[390px]">
                <input type="text" placeholder="Type to Search" class="w-[255px] bg-transpsrent border border-orange-500/50 rounded-l-md px-4
                        text-white outline-none placeholder:text-gray-300">
                
                <button class="w-[135px] bg-orange-600 text-white font-semibold rounded-r-md hover:bg-orange-700">
                    Search
                </button>
            </div>
        </nav>

        <section class="flex min-h-[calc(100vh-88px)] items-center px-8">
            <div class="max-w-2xl text-left justify-start font-['Times_New_Roman']">
                <h1 class="text-5xl font-bold leading-tight text-white">
                    Web Design &
                </h1>

                </h1>

                </h1>

                <button

                </div>

                <div class="mb-6">
                    <input
                        type="password"
                        placeholder="Enter Password Here"
                        class="w-full border-b-2 border-orange-500/50 bg-transparent px-1 py-2 text-white outline-none
                                placeholder:text-gray-300 focus:border-orange-500">
                </div>

                <button
